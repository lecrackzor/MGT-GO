<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart</title>
    <script type="importmap">
    {
        "imports": {
            "@wailsio/runtime": "/wails-runtime-shim.js"
        }
    }
    </script>
    <script src="lightweight-charts.standalone.production.js?v=4"></script>
    <link rel="stylesheet" href="chart.css">
</head>
<body>
    <h1 id="chart-title">Loading Chart...</h1>
    <div id="chart-container">
        <div id="chart-div">
            <div class="crosshair-line" id="crosshair-line"></div>
            <div class="crosshair-x-marker" id="crosshair-x-marker" aria-hidden="true">
                <span class="crosshair-x-marker-label" id="crosshair-x-marker-label"></span>
                <span class="crosshair-x-marker-line"></span>
            </div>
            <div class="crosshair-pulse-dots" id="crosshair-pulse-dots"></div>
            <div id="profile-replay-marker" hidden></div>
            <div id="level-alert-pop" hidden></div>
        </div>
        <div id="profile-split" hidden title="Drag to resize the profile"></div>
        <aside id="profile-pane" hidden>
            <button type="button" id="profile-popout" title="Open this profile in its own window" hidden>↗</button>
            <canvas id="profile-canvas"></canvas>
            <div id="profile-note"></div>
        </aside>
        <aside id="profile-metrics" hidden></aside>
        <div id="crosshair-info-box">
            <div id="crosshair-info-box-header">
                <span id="crosshair-info-box-header-title">Crosshair Info</span>
                <span class="crosshair-info-box-toggle" title="Collapse">▼</span>
            </div>
            <div id="crosshair-info-box-content"></div>
        </div>
        <div id="chart-context-menu" aria-hidden="true"></div>
        <div id="profile-hover" hidden></div>
    </div>
    <div id="chart-toolbar" class="window-toolbar">
        <div class="toolbar-left">
            <button id="profile-toggle-btn" title="Show profile ladders" hidden>Profile</button>
            <select id="profile-dte" aria-label="Profile expiration" hidden>
                <option value="zero">0 DTE</option>
                <option value="one">1 DTE</option>
                <option value="full">90 DTE</option>
            </select>
            <span id="profile-layers" hidden>
                <label><input type="checkbox" data-layer="classic" checked>Classic</label>
                <label><input type="checkbox" data-layer="state">State</label>
                <label><input type="checkbox" data-layer="gamma">Gamma</label>
                <label><input type="checkbox" data-layer="delta">Delta</label>
                <label><input type="checkbox" data-layer="vanna">Vanna</label>
                <label><input type="checkbox" data-layer="charm">Charm</label>
            </span>
            <select id="profile-mode" aria-label="Profile placement" hidden>
                <option value="side">Side</option>
                <option value="chart">Chart</option>
            </select>
            <span class="toolbar-dock">
                <button id="profile-detach-btn" type="button" hidden title="Open this side profile in its own window">Detach</button>
                <button id="profile-attach-btn" type="button" hidden title="Dock the profile window back onto this chart">Attach</button>
            </span>
        </div>
        <span id="profile-chart-note" class="toolbar-note" hidden></span>
        <div class="toolbar-right">
            <button id="reset-zoom-btn" title="Reset view to default zoom filter">Reset</button>
            <button id="auto-follow-btn" title="Auto-follow new data while preserving zoom">Auto-Follow: OFF</button>
            <button id="chart-screenshot-btn" title="Save a PNG of this window, including the profile and the information panel">Screenshot</button>
        </div>
    </div>
    <div id="profile-replay" hidden>
        <div class="toolbar-left">
            <button type="button" id="profile-replay-live">Live</button>
            <button type="button" id="profile-replay-play">Play</button>
            <button type="button" id="profile-replay-back" title="Previous sample">Prev</button>
            <button type="button" id="profile-replay-forward" title="Next sample">Next</button>
            <select id="profile-replay-speed" aria-label="Replay speed">
                <option value="1">1×</option>
                <option value="4">4×</option>
                <option value="16" selected>16×</option>
                <option value="64">64×</option>
            </select>
        </div>
        <span id="profile-replay-time">Live</span>
        <input id="profile-replay-range" type="range" min="0" max="0" value="0" aria-label="Profile time">
        <label id="profile-follow-label"><input type="checkbox" id="profile-follow-crosshair"> Follow crosshair</label>
    </div>
    <div id="status">Initializing...</div>
    <script type="module" src="js/chart/chart-main.js"></script>
</body>
</html>
