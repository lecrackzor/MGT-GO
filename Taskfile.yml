version: '3'

tasks:
  default:
    desc: Build the application
    cmds:
      - task: windows:build

  windows:build:
    desc: Build for Windows (with embedded icon and version info)
    cmds:
      - go-winres make
      - go build -ldflags="-H=windowsgui" -o bin/market-terminal.exe .

  dev:
    desc: Run the application in development mode (fast iteration)
    cmds:
      - go run .

  tidy:
    desc: Clean up and update Go module dependencies
    cmds:
      - go mod tidy

  clean:
    desc: Clean build artifacts
    cmds:
      - if exist bin rmdir /s /q bin
      - if exist rsrc_windows_amd64.syso del rsrc_windows_amd64.syso
      - if exist rsrc_windows_386.syso del rsrc_windows_386.syso
      - go clean
